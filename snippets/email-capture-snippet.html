<div style="max-width:720px;margin:56px auto 40px;padding:0 24px;">
  <div style="background:linear-gradient(180deg,#16213b,#1e293b);border:1px solid #334155;border-radius:14px;padding:32px;text-align:center;font-family:'DM Sans',sans-serif;">
    <div style="font-size:20px;font-weight:700;color:#e2e8f0;">Don't just watch this dashboard — get told when it matters</div>
